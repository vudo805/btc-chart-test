<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BTC Price + Liquidity Heatmap</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background-color: var(--tg-theme-bg-color, #ffffff);
    color: var(--tg-theme-text-color, #000000);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  .page {
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  #header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 6px 10px;
    font-size: 0.75rem;
    color: var(--tg-theme-hint-color, #999999);
    flex-shrink: 0;
  }
  #header strong {
    color: var(--tg-theme-text-color, #000000);
    font-size: 0.9rem;
  }
  #chart-wrap {
    position: relative;
    flex: 1;
    min-height: 0;
  }
  #chart-container, #heatmap-canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }
  #heatmap-canvas {
    pointer-events: none;
    /* Lightweight Charts' own internal canvases use z-index: 1/2, which
       paint over a z-index: auto sibling regardless of DOM order. */
    z-index: 5;
  }
</style>
</head>
<body>
  <div class="page">
    <div id="header">
      <span>BTC/USDT</span>
      <strong id="mid-price">connecting…</strong>
      <span id="spread"></span>
    </div>
    <div id="chart-wrap">
      <div id="chart-container"></div>
      <canvas id="heatmap-canvas"></canvas>
    </div>
  </div>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const rootStyle = getComputedStyle(document.documentElement);
    function themeColor(varName, fallback) {
      return rootStyle.getPropertyValue(varName).trim() || fallback;
    }
    const bgColor = themeColor("--tg-theme-bg-color", "#ffffff");
    const textColor = themeColor("--tg-theme-text-color", "#000000");
    const gridColor = themeColor("--tg-theme-hint-color", "#cccccc");

    const SYMBOL = "btcusdt";
    const INTERVAL = "1m";

    // ---- Price chart: self-hosted so the heatmap can share its exact coordinate space ----
    const chartWrap = document.getElementById("chart-wrap");
    const chart = LightweightCharts.createChart(document.getElementById("chart-container"), {
      layout: { background: { color: bgColor }, textColor: textColor },
      grid: {
        vertLines: { color: gridColor + "33" },
        horzLines: { color: gridColor + "33" },
      },
      // rightOffset reserves space past the last candle so "now" (always a
      // little ahead of the still-open last bar) has a valid pixel position
      // for the heatmap to plot into - otherwise timeToCoordinate() returns
      // null for every live snapshot and the heatmap never draws anything.
      timeScale: { timeVisible: true, secondsVisible: false, rightOffset: 3 },
      rightPriceScale: { borderColor: gridColor },
      crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
    });
    const candleSeries = chart.addCandlestickSeries({
      upColor: "#26a69a",
      downColor: "#ef5350",
      borderVisible: false,
      wickUpColor: "#26a69a",
      wickDownColor: "#ef5350",
    });

    const heatCanvas = document.getElementById("heatmap-canvas");
    const heatCtx = heatCanvas.getContext("2d");

    function resizeAll() {
      const rect = chartWrap.getBoundingClientRect();
      chart.resize(rect.width, rect.height);

      const dpr = window.devicePixelRatio || 1;
      heatCanvas.width = rect.width * dpr;
      heatCanvas.height = rect.height * dpr;
      heatCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

      drawHeatmap();
    }
    window.addEventListener("resize", resizeAll);

    fetch(`https://api.binance.com/api/v3/klines?symbol=${SYMBOL.toUpperCase()}&interval=${INTERVAL}&limit=100`)
      .then((r) => r.json())
      .then((rows) => {
        candleSeries.setData(rows.map((r) => ({
          time: Math.floor(r[0] / 1000),
          open: parseFloat(r[1]),
          high: parseFloat(r[2]),
          low: parseFloat(r[3]),
          close: parseFloat(r[4]),
        })));
        // Zoom to a window comparable to the live heatmap's history span
        // (HISTORY_LIMIT * SNAPSHOT_INTERVAL_MS below) - otherwise the
        // heatmap dots are squeezed into a sliver at the chart's edge and
        // are effectively invisible against the full fetched history.
        // Logical (bar-index) range, not setVisibleRange's time-based one:
        // setVisibleRange clamps `to` back to the last actual bar's
        // timestamp and ignores rightOffset, so it can never show the few
        // seconds of "future" space the live heatmap ticks need.
        const desiredVisibleBars = 15; // ~15 minutes of 1m candles
        chart.timeScale().setVisibleLogicalRange({
          from: rows.length - desiredVisibleBars,
          to: rows.length - 1 + 3, // + rightOffset
        });
        resizeAll();
      })
      .catch((err) => console.error("Failed to load initial candles", err));

    function connectKlineStream() {
      const ws = new WebSocket(`wss://stream.binance.com:9443/ws/${SYMBOL}@kline_${INTERVAL}`);
      ws.onmessage = (event) => {
        const k = JSON.parse(event.data).k;
        candleSeries.update({
          time: Math.floor(k.t / 1000),
          open: parseFloat(k.o),
          high: parseFloat(k.h),
          low: parseFloat(k.l),
          close: parseFloat(k.c),
        });
      };
      ws.onclose = () => setTimeout(connectKlineStream, 2000);
      ws.onerror = () => ws.close();
    }

    // ---- Liquidity heatmap: drawn in the chart's own price/time coordinates ----
    const midPriceEl = document.getElementById("mid-price");
    const spreadEl = document.getElementById("spread");

    const HISTORY_LIMIT = 900;       // ~15 minutes at one snapshot per second
    const SNAPSHOT_INTERVAL_MS = 1000;
    const BAR_SECONDS = parseInt(INTERVAL, 10) * 60; // "1m" -> 60
    let heatmapHistory = [];
    let lastSnapshotAt = 0;

    // timeToCoordinate() only resolves times that exactly match a real bar's
    // timestamp - it does not interpolate between bars. Heatmap snapshots
    // land on arbitrary seconds, so look up the coordinate of the bar that
    // contains this second and offset by the sub-bar fraction instead.
    function timeToX(t) {
      const barTime = Math.floor(t / BAR_SECONDS) * BAR_SECONDS;
      const barX = chart.timeScale().timeToCoordinate(barTime);
      if (barX === null) return null;
      const barSpacing = chart.timeScale().options().barSpacing;
      return barX + ((t - barTime) / BAR_SECONDS) * barSpacing;
    }

    function drawHeatmap() {
      const rect = chartWrap.getBoundingClientRect();
      heatCtx.clearRect(0, 0, rect.width, rect.height);
      if (!heatmapHistory.length) return;

      let maxQty = 0;
      for (const entry of heatmapHistory) {
        for (const [, q] of entry.bids) if (q > maxQty) maxQty = q;
        for (const [, q] of entry.asks) if (q > maxQty) maxQty = q;
      }
      if (maxQty === 0) return;

      const colWidth = 10;
      const rowHeight = 8;

      function drawLevels(levels, x, rgb) {
        for (const [price, qty] of levels) {
          const y = candleSeries.priceToCoordinate(price);
          if (y === null) continue;
          const alpha = Math.max(0.15, Math.min(1, qty / maxQty));
          heatCtx.fillStyle = `rgba(${rgb},${alpha.toFixed(2)})`;
          heatCtx.fillRect(x - colWidth / 2, y - rowHeight / 2, colWidth, rowHeight);
        }
      }

      for (const entry of heatmapHistory) {
        const x = timeToX(entry.time);
        if (x === null) continue;
        drawLevels(entry.bids, x, "33,150,243");
        drawLevels(entry.asks, x, "255,152,0");
      }
    }

    function connectDepthStream() {
      const ws = new WebSocket(`wss://stream.binance.com:9443/ws/${SYMBOL}@depth20@100ms`);
      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        const bids = data.bids.map(([p, q]) => [parseFloat(p), parseFloat(q)]);
        const asks = data.asks.map(([p, q]) => [parseFloat(p), parseFloat(q)]);

        const bestBid = bids[0][0];
        const bestAsk = asks[0][0];
        midPriceEl.textContent = "$" + ((bestBid + bestAsk) / 2).toFixed(2);
        spreadEl.textContent = "spread $" + (bestAsk - bestBid).toFixed(2);

        const now = Date.now();
        if (now - lastSnapshotAt >= SNAPSHOT_INTERVAL_MS) {
          lastSnapshotAt = now;
          const nowSec = Math.floor(now / 1000);
          heatmapHistory.push({ time: nowSec, bids, asks });
          if (heatmapHistory.length > HISTORY_LIMIT) heatmapHistory.shift();
          // Keep following real time each tick - otherwise the view stays
          // pinned to wherever it was at load and, once wall-clock time
          // drifts past the last visible bar, timeToCoordinate() returns
          // null for every new snapshot and the heatmap stops drawing.
          chart.timeScale().scrollToRealTime();
          drawHeatmap();
        }
      };
      ws.onclose = () => {
        midPriceEl.textContent = "reconnecting…";
        setTimeout(connectDepthStream, 2000);
      };
      ws.onerror = () => ws.close();
    }

    chart.timeScale().subscribeVisibleLogicalRangeChange(drawHeatmap);

    resizeAll();
    connectKlineStream();
    connectDepthStream();
  </script>
</body>
</html>
